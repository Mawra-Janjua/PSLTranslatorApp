
[versions]
# Build Tools & Language
agp = "8.10.1"
kotlin = "1.9.22"

# Core & Architecture
coreKtx = "1.12.0"
appcompat = "1.6.1"
lifecycle = "2.8.5"
datastore = "1.0.0"
navigation = "2.8.5"

# Jetpack Compose
composeBom = "2024.02.00"
activityCompose = "1.8.2"
material3 = "1.2.1"
materialIcons = "1.6.1"

# Media & Camera
media3 = "1.2.1"
camerax = "1.3.1"

# ML & AI
mediapipe = "0.10.14"
tflite = "2.14.0"

# Testing
junit = "4.13.2"
espresso = "3.5.1"
junitExt = "1.1.5"

[libraries]
# Lifecycle (Fixed the "Unresolved reference: compose" error here)
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Navigation (Use this for NavHost and Routes)
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# DataStore & Storage
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }

# Compose UI Components
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

# Material Design
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# CameraX
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# Media3 UI library (Add this line)
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
# Media3 (ExoPlayer)
androidx-media3 = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }

# ML (TensorFlow Lite)
tflite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tflite" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }